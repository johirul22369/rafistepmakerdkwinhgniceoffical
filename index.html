<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Step Calculator - Owner Rafi Boss</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: #03050b;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            padding: 20px 0;
        }

        /* মূল কার্ড কন্টেইনার */
        .main-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        /* টপ পার্পল হেডার সেকশন */
        .card-header {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            padding: 20px 15px;
            text-align: center;
            color: #ffffff;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        /* প্রোফাইল ভিডিও কন্টেইনার */
        .logo-circle {
            width: 75px;
            height: 75px;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-circle video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .header-subtitle {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* টেলিগ্রাম লোগো বাটন */
        .contact-owner-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0ea5e9;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 18px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.6);
            gap: 6px;
        }

        .contact-owner-btn svg {
            width: 15px;
            height: 15px;
            fill: #ffffff;
        }

        /* বডি বা ইনপুট সেকশন */
        .card-body {
            padding: 20px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-heading {
            font-size: 16px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            margin-bottom: 2px;
        }

        .input-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            outline: none;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .calculate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4338ca);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease;
        }

        .calculate-btn:active {
            transform: scale(0.98);
        }

        /* স্টেপ রেজাল্ট বক্সসমূহ */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .step-result-row {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #ffffff;
            padding: 11px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-label {
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .step-value {
            font-weight: 900;
            color: #fef08a;
        }

        /* ফুটার */
        .card-footer {
            padding: 12px;
            text-align: center;
            background: #03050b;
            color: #64748b;
            font-size: 9px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-footer span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- টপ হেডার -->
        <div class="card-header">
            <!-- প্রোফাইল ভিডিও -->
            <div class="logo-circle">
                <video src="https://pdftolink.io/file/r2_dXNlcnMvZ3Vlc3QvOTVlNzQxN2UtNDRkNi00MGYyLTk1MDAtYmZlOTVkNmM2NmI1Lm1wNA" autoplay loop muted playsinline></video>
            </div>
            <div class="header-title">⭐ OWNER RAFI BOSS ⭐</div>
            <div class="header-subtitle">STEP MAKER</div>
            
            <!-- শুধুমাত্র টেলিগ্রাম লোগো বাটন -->
            <a href="https://t.me/GREND_OWNER11" target="_blank" class="contact-owner-btn" title="Telegram">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.941z"/>
                </svg>
            </a>
        </div>

        <!-- ইনপুট ও ক্যালকুলেশন অংশ -->
        <div class="card-body">
            <div class="section-heading">Step হিসাব করুন</div>
            
            <!-- ব্যালেন্স ইনপুট -->
            <input type="number" id="balance-input" class="input-box" placeholder="Total Balance (e.g., 500)">
            
            <!-- মোট স্টেপ সংখ্যা ইনপুট -->
            <input type="number" id="steps-count-input" class="input-box" placeholder="Total Steps (e.g., 7)" value="7">

            <!-- ক্যালকুলেট বাটন -->
            <button class="calculate-btn" onclick="generateSteps()">CALCULATE</button>

            <!-- আউটপুট বা স্টেপ রেজাল্ট দেখানোর লিস্ট -->
            <div class="results-container" id="steps-output-container">
                <div style="text-align: center; color: #64748b; font-size: 11px; padding: 10px; font-weight: 700;">
                    ব্যালেন্স এবং স্টেপ সংখ্যা দিয়ে CALCULATE এ চাপ দিন
                </div>
            </div>
        </div>

        <!-- ফুটার -->
        <div class="card-footer">
            ⚡ Powered by <span>Netlify & Rafi Boss</span> ⚡
        </div>
    </div>

    <script>
        function generateSteps() {
            let balance = parseFloat(document.getElementById('balance-input').value);
            let totalSteps = parseInt(document.getElementById('steps-count-input').value);
            let container = document.getElementById('steps-output-container');

            if (isNaN(balance) || balance <= 0) {
                container.innerHTML = `<div style="text-align: center; color: #ef4444; font-size: 11px; font-weight: 800; padding: 10px;">সঠিক ব্যালেন্স লিখুন!</div>`;
                return;
            }

            if (isNaN(totalSteps) || totalSteps <= 0 || totalSteps > 20) {
                container.innerHTML = `<div style="text-align: center; color: #ef4444; font-size: 11px; font-weight: 800; padding: 10px;">১ থেকে ২০ এর মধ্যে স্টেপ সংখ্যা দিন!</div>`;
                return;
            }

            let multiplier = 1.85; 
            let baseWeights = [];
            let totalWeight = 0;

            for (let i = 0; i < totalSteps; i++) {
                let weight = Math.pow(multiplier, i);
                baseWeights.push(weight);
                totalWeight += weight;
            }

            let htmlContent = "";
            for (let i = 0; i < totalSteps; i++) {
                let stepAmount = (balance * (baseWeights[i] / totalWeight));
                htmlContent += `
                    <div class="step-result-row">
                        <span class="step-label">Step ${i + 1}:</span>
                        <span class="step-value">${stepAmount.toFixed(2)}৳</span>
                    </div>
                `;
            }

            container.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
